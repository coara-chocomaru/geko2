plugins { 
    id 'com.android.application'
}

android {
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    namespace = 'com.coara.browser2'

    defaultConfig {
        applicationId = 'com.coara.browser2'
        minSdk = 26
        targetSdk = 34
        versionCode = 80
        versionName = "1.2"
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        if (project.hasProperty('bundleBuild')) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }
    
    def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
    def releaseKeystorePassword = System.getenv('RELEASE_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD')
    def releaseSigningValues = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
    def releaseSigningConfigured = releaseSigningValues.every { it != null && !it.trim().isEmpty() }
    def releaseSigningPartiallyConfigured = releaseSigningValues.any { it != null && !it.trim().isEmpty() }

    if (releaseSigningPartiallyConfigured && !releaseSigningConfigured) {
        throw new GradleException('Release signing requires RELEASE_KEYSTORE_PATH, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD.')
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable = false
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }

    lint {
        disable += ['ExpiredTargetSdkVersion', 'NewApi', 'Range', 'SetTextI18n', 'ScopedStorage', 'FieldCanBeLocal', 'GradleDependency']
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    splits {
        abi {
            enable = !project.hasProperty('bundleBuild')
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['DebugProbesKt.bin', 'META-INF/*.version', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'kotlin/**', 'kotlin-tooling-metadata.json', '**/*.kotlin_builtins']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.emoji2:emoji2:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.mozilla.geckoview:geckoview:158.0.20261021001945'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
